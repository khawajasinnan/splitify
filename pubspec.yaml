name: splitlify
description: "Splitlify - Your Digital Bill Splitter. A Flutter-based expense tracking and settlement app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  
  # Supabase Integration
  supabase_flutter: ^2.5.0
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Navigation
  go_router: ^14.2.0
  
  # UI Components
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  
  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  equatable: ^2.0.5
  uuid: ^4.4.0
  
  # Networking & Data
  http: ^1.2.1
  
  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  
  # Code Generation
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  
  # Assets will be added as needed
  # assets:
  #   - assets/images/
  #   - assets/icons/
  
  # Fonts are loaded via google_fonts package
  # No need to include font files manually
